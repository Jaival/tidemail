<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px;
          display: grid; grid-template-columns: 200px 1fr; gap: 16px; align-items: center; }
  .name { font-weight: 600; font-size: 15px; }
  .idea { color: var(--muted-foreground); font-size: 13px; margin-top: 4px; line-height: 1.4; }
  .tiles { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .tile { width: 112px; height: 112px; border-radius: 12px; display: grid; place-items: center; }
  .tile.dark { background: #111719; }
  .tile.light { background: #f2f6f7; }
  .small { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 6px; font-size: 11px; }
  .row.dark { background: #0c1113; color: #8f9fa4; }
  .row.light { background: #ffffff; color: #5d6d71; border: 1px solid #e1e8ea; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fb5a5"/><stop offset="1" stop-color="#0b7f74"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16262a"/><stop offset="1" stop-color="#0c1113"/>
    </linearGradient>
    <clipPath id="env"><rect x="13" y="19" width="38" height="28" rx="3.5"/></clipPath>

    <!-- A: Wave flap -->
    <symbol id="a" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="url(#teal)"/>
      <rect x="13" y="19" width="38" height="28" rx="3.5" fill="none" stroke="#fff" stroke-width="4"/>
      <path d="M15 22 C19 31 24 31 27 27 C30 23 34 23 37 27 C40 31 45 31 49 22" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- B: Rising tide -->
    <symbol id="b" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="url(#deep)"/>
      <g clip-path="url(#env)">
        <rect x="13" y="19" width="38" height="28" fill="#fff" opacity=".08"/>
        <path d="M10 36 q4.75 -4 9.5 0 t9.5 0 t9.5 0 t9.5 0 t9.5 0 V50 H10 Z" fill="url(#teal)"/>
      </g>
      <rect x="13" y="19" width="38" height="28" rx="3.5" fill="none" stroke="#e3ebed" stroke-width="3.5"/>
      <path d="M14.5 21 L32 33 L49.5 21" fill="none" stroke="#e3ebed" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- C: Moon and tide -->
    <symbol id="c" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="url(#deep)"/>
      <circle cx="42" cy="20" r="8" fill="#2fb5a5"/>
      <path d="M12 36 q5 -5 10 0 t10 0 t10 0 t10 0" fill="none" stroke="#e3ebed" stroke-width="4" stroke-linecap="round"/>
      <path d="M12 47 q5 -5 10 0 t10 0 t10 0 t10 0" fill="none" stroke="#2fb5a5" stroke-width="4" stroke-linecap="round"/>
    </symbol>

    <!-- D: T-wave monogram -->
    <symbol id="d" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="url(#teal)"/>
      <path d="M13 21 q4.75 -5 9.5 0 t9.5 0 t9.5 0 t9.5 0" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M32 25 V49" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    </symbol>

    <!-- E: Swift tide (three waves) -->
    <symbol id="e" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="url(#teal)"/>
      <path d="M12 22 q5 -5 10 0 t10 0 t10 0 t10 0" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M17 33 q5 -5 10 0 t10 0 t10 0" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" opacity=".8"/>
      <path d="M22 44 q5 -5 10 0 t10 0" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" opacity=".6"/>
    </symbol>
  </defs>
</svg>

<div class="grid" id="grid"></div>
<script>
const concepts = [
  ["a", "A · Wave flap", "Envelope; the flap is a wave instead of a V. Says “mail” first, “tide” second."],
  ["b", "B · Rising tide", "Envelope filling with water: the inbox as a tide. Dark tile, teal water."],
  ["c", "C · Moon and tide", "The moon pulls the tide. No envelope; abstract, calm, distinct in a tray."],
  ["d", "D · T-wave", "Monogram: a T whose crossbar is a wave. Strong at 16 px."],
  ["e", "E · Swift tide", "Three waves narrowing to a point: speed, keyboard flow. Reads as a downward arrow too."],
];
const grid = document.getElementById("grid");
for (const [id, name, idea] of concepts) {
  const use = (s) => `<svg width="${s}" height="${s}"><use href="#${id}"/></svg>`;
  grid.insertAdjacentHTML("beforeend", `
    <div class="card">
      <div><div class="name">${name}</div><div class="idea">${idea}</div></div>
      <div class="tiles">
        <div class="tile dark">${use(80)}</div>
        <div class="tile light">${use(80)}</div>
        <div class="small">
          <div class="row dark">${use(32)}${use(16)} Tidemail</div>
          <div class="row light">${use(32)}${use(16)} Tidemail</div>
        </div>
      </div>
    </div>`);
}
</script>
</body>
</html>
