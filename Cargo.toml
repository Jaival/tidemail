[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
tidemail-db = { path = "crates/db" }
tidemail-gmail = { path = "crates/gmail" }
tidemail-sync = { path = "crates/sync" }
tidemail-search = { path = "crates/search" }
tidemail-render = { path = "crates/render" }

rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
ammonia = "4"

# UI. Exact pins, see docs/adr/0001-native-ui-with-gpui.md. Upgrade only on purpose.
gpui-kit = "=0.9.0"
gpui-webview = "=0.9.0"
tray-icon = "=0.26.1"

[profile.release]
codegen-units = 1
lto = "thin"

# Parallel DirectX device creation at startup (cold-launch budget).
# See vendor/gpui-pre-windows-parallel-dx.patch.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
